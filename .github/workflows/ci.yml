name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      protocol_revision:
        description: Published protocol commit containing http_client (40-character SHA)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 1
      - name: Unit and driver contracts
        run: node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
      - name: Install browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser and mocked IPC contracts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-tests/node_modules/playwright
        run: |
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:1420/ > /dev/null; then break; fi
            kill -0 "$server"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:1420/ > /dev/null
          node --test --test-concurrency=1 tests/*.test.cjs
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            ${{ runner.temp }}/vite.log
            /tmp/burst-*.png
          retention-days: 7

  native:
    name: Linux native command tests
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          path: node-gui
      - id: protocol
        name: Resolve pinned protocol dependency
        env:
          REQUESTED_REVISION: ${{ inputs.protocol_revision }}
        run: |
          revision="${REQUESTED_REVISION:-$(cat node-gui/ci/protocol-revision)}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "A full protocol commit SHA is required" >&2; exit 1; }
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: BURST-UBI/protocol
          ref: ${{ steps.protocol.outputs.revision }}
          path: protocol
      - name: Verify shared dependency is published
        run: |
          test -f protocol/http_client/Cargo.toml || { echo "Pinned protocol revision does not contain http_client; publish the dependency and update ci/protocol-revision" >&2; exit 1; }
          cargo metadata --manifest-path node-gui/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: node-gui/dist
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node-gui/src-tauri
      - run: cargo test --locked --lib
        working-directory: node-gui/src-tauri
